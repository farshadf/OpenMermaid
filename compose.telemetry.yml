services:
  telemetry:
    image: open-mermaid-telemetry:${OPEN_MERMAID_TELEMETRY_IMAGE_TAG:-local}
    build:
      context: ./services/telemetry
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPEN_MERMAID_TELEMETRY_ORIGIN: ${OPEN_MERMAID_TELEMETRY_ORIGIN:?Set the exact canonical HTTPS origin}
      OPEN_MERMAID_TELEMETRY_PORT: '8091'
      OPEN_MERMAID_TELEMETRY_DATABASE_PATH: /data/telemetry.sqlite
    ports:
      - '127.0.0.1:${OPEN_MERMAID_TELEMETRY_BIND_PORT:-8091}:8091'
    read_only: true
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - telemetry-data:/data
    pids_limit: 64
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8091/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  telemetry-data:
