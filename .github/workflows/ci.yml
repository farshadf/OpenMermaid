name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://openmermaid.example
  PUBLIC_INDEX_SITE: 'false'
  PUBLIC_TELEMETRY_MODE: 'off'
  PUBLIC_AD_MODE: 'off'
  CI: 'true'

jobs:
  build:
    name: Reproducible static artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate the public-release configuration gate
        run: node scripts/validate-release-env.mjs
        env:
          PUBLIC_SITE_URL: https://openmermaid.test
          PUBLIC_INDEX_SITE: 'true'

      - name: Build manifest-backed portable artifact
        run: pnpm build

      - name: Test artifact integrity failure modes
        run: pnpm test:artifact-contract

      - name: Rebuild and verify deterministic output
        run: pnpm test:build-reproducibility

      - name: Upload static artifact
        id: upload-dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmermaid-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Record artifact archive digest
        run: echo "Static artifact SHA-256 ${{ steps.upload-dist.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality and contracts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the reproducible static artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openmermaid-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify downloaded artifact integrity
        run: pnpm test:artifact

      - name: Check immutable CI action references
        run: pnpm test:ci-config

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, contract, security corpus, and coverage gates
        run: pnpm test:coverage

      - name: Install Chrome for Lighthouse
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Run static and interactive Lighthouse gates
        run: pnpm lighthouse
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload Lighthouse lab reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.sha }}
          path: |
            reports/lighthouse-static/
            reports/lighthouse-editor/
          if-no-files-found: warn
          retention-days: 90

      - name: Check links, metadata, indexing, chunks, and bundle budgets
        run: pnpm test:metadata

      - name: Check standalone independence contract
        run: env -u OPENAI_API_KEY -u CHATGPT_APP_ID -u MCP_SERVER_URL pnpm test:independence

      - name: Check dependency licenses
        run: pnpm test:licenses

      - name: Upload complete dependency license report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-licenses-${{ github.sha }}
          path: reports/dependency-licenses.json
          if-no-files-found: warn
          retention-days: 90

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser:
    name: Browser E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: mobile-webkit
            engine: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the reproducible static artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openmermaid-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify downloaded artifact integrity
        run: pnpm test:artifact

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser suite
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  advertising-contract:
    name: Agency advertising artifact contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify inert placeholder inventory
        run: pnpm build && pnpm test:advertising
        env:
          PUBLIC_AD_MODE: placeholder
          PUBLIC_INDEX_SITE: 'false'

      - name: Build and verify the agency release contract
        run: pnpm build:release && pnpm test:advertising && node scripts/check-built-site.mjs && pnpm test:independence
        env:
          PUBLIC_SITE_URL: https://openmermaid.test
          PUBLIC_EDITOR_ORIGIN: https://app.openmermaid.test
          PUBLIC_INDEX_SITE: 'true'
          PUBLIC_AD_MODE: agency
          PUBLIC_AD_PROVIDER: google-adsense
          PUBLIC_ADSENSE_CLIENT: ca-pub-1234567890123456
          PUBLIC_ADSENSE_SLOT: '1234567890'

  deployment:
    name: Docker and Caddy deployment contract
    needs:
      - build
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the quality-gated static artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openmermaid-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify downloaded artifact integrity
        run: pnpm test:artifact

      - name: Install deployment-smoke browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify hardened image, Caddy edge, and deployed browser
        run: pnpm test:deployment:browser

      - name: Build release image for container inventory
        run: docker build --tag open-mermaid:ci .

      - name: Generate container CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: open-mermaid:ci
          format: cyclonedx-json
          output-file: reports/container-sbom.cdx.json
          artifact-name: open-mermaid-container-${{ github.sha }}.cdx.json
          upload-release-assets: false

  aggregate-telemetry:
    name: Aggregate telemetry deployment contract
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUBLIC_SITE_URL: https://openmermaid.test
      PUBLIC_INDEX_SITE: 'false'
      PUBLIC_TELEMETRY_MODE: aggregate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify aggregate artifact, collector, persistence, and Caddy boundary
        run: pnpm test:telemetry-deployment

      - name: Install aggregate browser-test engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Run aggregate-only browser telemetry contract
        run: pnpm exec playwright test tests/e2e/telemetry.spec.ts --project=chromium

      - name: Build collector image for inventory and scanning
        run: docker build --pull --tag open-mermaid-telemetry:ci services/telemetry

      - name: Generate collector CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: open-mermaid-telemetry:ci
          format: cyclonedx-json
          output-file: reports/telemetry-container-sbom.cdx.json
          artifact-name: open-mermaid-telemetry-container-${{ github.sha }}.cdx.json
          upload-release-assets: false

      - name: Scan collector image for high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: open-mermaid-telemetry:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate and schema-validate CycloneDX SBOM
        run: pnpm sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
