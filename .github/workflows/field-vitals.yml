name: Field Web Vitals

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1'

permissions:
  contents: read

concurrency:
  group: field-web-vitals
  cancel-in-progress: true

jobs:
  crux-history:
    name: CrUX history snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Query configured production field data
        run: node scripts/report-crux.mjs
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}

      - name: Upload aggregate field report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crux-history-${{ github.run_id }}
          path: |
            reports/crux-history.json
            reports/crux-history.md
          if-no-files-found: error
          retention-days: 90
