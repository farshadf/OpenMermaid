server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    etag on;
    if_modified_since exact;
    access_log off;

    error_page 404 /404.html;

    # Host Caddy and Docker use this exact endpoint for active health checks.
    # It is deliberately independent of any application route or redirect.
    location = /healthz {
        include /etc/nginx/main-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro fingerprints everything under /_assets/. Missing assets fall
    # through to the application 404 and therefore are never cached forever.
    location ^~ /_assets/ {
        include /etc/nginx/main-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The sandboxed renderer intentionally uses a smaller response-header set.
    # In particular, do not add CORP here: its opaque iframe origin must still
    # be able to load the application-owned classic runtime.
    location = /renderer/runtime.js {
        include /etc/nginx/renderer-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /renderer/ {
        include /etc/nginx/renderer-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # Internal error-page handling preserves the 404 status instead of turning
    # an unknown URL into a successful SPA fallback.
    location = /404.html {
        internal;
        include /etc/nginx/main-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        include /etc/nginx/main-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
